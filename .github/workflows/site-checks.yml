name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  rust-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            demos/fits-inspector
            demos/plots
            demos/code-examples
      - run: cargo fmt --manifest-path demos/fits-inspector/Cargo.toml -- --check
      - run: cargo fmt --manifest-path demos/plots/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path demos/fits-inspector/Cargo.toml
      - run: cargo check --locked --manifest-path demos/plots/Cargo.toml
      - run: python3 demos/check_examples.py
