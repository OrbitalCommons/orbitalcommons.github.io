name: Published site

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

# A newer Pages deployment supersedes checks of the older published bytes.
concurrency:
  group: published-site
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'github-pages' &&
       github.event.deployment.ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify published bytes and content types
        run: python3 tools/check_deployed.py
